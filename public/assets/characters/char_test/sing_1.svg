  <circle cx="288" cy="96" r="28" fill="url(#hairGrad1)" stroke="#00f5ff" stroke-width="2.5"/>
  <path d="M126 110 C112 175 120 220 142 235 L278 235 C300 220 308 175 294 110 Z" fill="url(#hairGrad1)"/>

  <!-- 顔輪郭 -->
  <path d="M148 118 C148 75 272 75 272 118 C272 168 246 202 210 202 C174 202 148 168 148 118 Z" fill="#ffedd5" stroke="#f9a8d4" stroke-width="2"/>

  <!-- 前髪 -->
  <path d="M144 125 C146 74 274 74 276 125 C262 98 248 122 236 102 C224 126 196 126 184 102 C172 122 158 98 144 125 Z" fill="url(#hairGrad1)" stroke="#00f5ff" stroke-width="2"/>

