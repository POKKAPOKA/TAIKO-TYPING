  <g transform="translate(268, 92)">
    <circle cx="0" cy="-12" r="8" fill="#f472b6"/>
    <circle cx="11" cy="-4" r="8" fill="#f472b6"/>
    <circle cx="7" cy="9" r="8" fill="#f472b6"/>
    <circle cx="-7" cy="9" r="8" fill="#f472b6"/>
    <circle cx="-11" cy="-4" r="8" fill="#f472b6"/>
    <circle cx="0" cy="0" r="5" fill="#fde047"/>
