  <path d="M168 230 L210 295 L252 230" stroke="url(#neonTrim1)" stroke-width="6" stroke-linecap="round"/>

  <!-- 帯（サイバーネオン帯） -->
  <rect x="148" y="310" width="124" height="46" rx="8" fill="#1e0b36" stroke="#f472b6" stroke-width="3.5"/>
  <line x1="150" y1="333" x2="270" y2="333" stroke="#00f5ff" stroke-width="3"/>
  <circle cx="210" cy="333" r="11" fill="#f472b6" stroke="#ffffff" stroke-width="2.5"/>

  <!-- 首 -->
  <rect x="194" y="192" width="32" height="42" rx="10" fill="#ffe4d6"/>
  <rect x="193" y="206" width="34" height="8" rx="4" fill="#1e1b4b" stroke="#00f5ff" stroke-width="1.5"/>

