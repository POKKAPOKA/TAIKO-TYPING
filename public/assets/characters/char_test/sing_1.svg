<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 520" fill="none">
  <defs>
    <linearGradient id="kimonoGrad1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b1d70"/>
      <stop offset="50%" stop-color="#1e1042"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="neonTrim1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="50%" stop-color="#d946ef"/>
      <stop offset="100%" stop-color="#00f5ff"/>
    </linearGradient>
    <linearGradient id="hairGrad1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#311b52"/>
      <stop offset="65%" stop-color="#4c1d95"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <radialGradient id="aura1" cx="50%" cy="45%" r="48%">
      <stop offset="0%" stop-color="#00f5ff" stop-opacity="0.32"/>
      <stop offset="55%" stop-color="#d946ef" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 背面サイバーオーラ -->
  <circle cx="210" cy="240" r="190" fill="url(#aura1)"/>

  <!-- 振袖（左右の袖） -->
  <path d="M135 245 L45 360 L95 425 L165 320 Z" fill="url(#kimonoGrad1)" stroke="url(#neonTrim1)" stroke-width="4"/>
  <path d="M285 245 L375 350 L325 415 L255 320 Z" fill="url(#kimonoGrad1)" stroke="url(#neonTrim1)" stroke-width="4"/>

  <!-- 着物ボディ＆スカート -->
