  <!-- 目（キラキラ笑顔の瞳：sing_1） -->
  <ellipse cx="180" cy="145" rx="13" ry="15" fill="#1e1b4b"/>
  <ellipse cx="180" cy="146" rx="10" ry="12" fill="#a855f7"/>
  <circle cx="176" cy="140" r="4.5" fill="#ffffff"/>
  <circle cx="185" cy="151" r="2.5" fill="#00f5ff"/>

  <ellipse cx="240" cy="145" rx="13" ry="15" fill="#1e1b4b"/>
  <ellipse cx="240" cy="146" rx="10" ry="12" fill="#a855f7"/>
  <circle cx="236" cy="140" r="4.5" fill="#ffffff"/>
  <circle cx="245" cy="151" r="2.5" fill="#00f5ff"/>

  <!-- 眉（ご機嫌） -->
  <path d="M165 124 Q180 118 193 124" stroke="#311b52" stroke-width="3" stroke-linecap="round"/>
  <path d="M227 124 Q240 118 255 124" stroke="#311b52" stroke-width="3" stroke-linecap="round"/>

  <!-- チーク -->
  <ellipse cx="163" cy="162" rx="9" ry="5" fill="#fb7185" fill-opacity="0.55"/>
  <ellipse cx="257" cy="162" rx="9" ry="5" fill="#fb7185" fill-opacity="0.55"/>

  <!-- 口（笑顔・ハミング：sing_1） -->
  <path d="M196 172 Q210 184 224 172" stroke="#e11d48" stroke-width="4" stroke-linecap="round" fill="none"/>

  <!-- 左手（リズムを取るポーズ） -->
  <circle cx="315" cy="240" r="14" fill="#ffedd5" stroke="#00f5ff" stroke-width="2"/>

  <!-- 右手＆サイバーマイク -->
  <g transform="translate(118, 178) rotate(-25)">
